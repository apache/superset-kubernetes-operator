name: Sync tool checksums

# Keeps hack/tool-checksums.txt in sync with the pinned rumdl / operator-sdk /
# opm / helm-unittest versions. The in-repo download recipes fail closed when a
# version has no matching pin, so a bump without a resync surfaces at use time;
# this scheduled job additionally regenerates the pins and opens a PR so the
# file cannot drift silently (mirrors the supported-k8s auto-sync).

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync tool-checksums.txt
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regenerate hack/tool-checksums.txt from the pinned versions
        run: make sync-tool-checksums
      - name: Open or update PR if anything changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/sync-tool-checksums
          base: main
          commit-message: |
            chore(ci): sync tool checksums

            Auto-generated by .github/workflows/sync-tool-checksums.yaml.
          title: 'chore(ci): sync tool checksums'
          body: |
            Automated resync of `hack/tool-checksums.txt` with the pinned
            rumdl / operator-sdk / opm / helm-unittest versions
            (`scripts/sync-tool-checksums.sh`). A diff here means a pinned tool
            version changed without its in-repo SHA-256 pins being regenerated.

            **Heads up:** PRs opened by `GITHUB_TOKEN` don't trigger CI.
            Close + reopen this PR (or push an empty commit) to run the
            required checks before merging.
          labels: |
            dependencies
          delete-branch: true
