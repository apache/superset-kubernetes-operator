name: Docs

on:
  push:
    branches: [main]
    # Final release tags only; RC tags (v0.3.0-rc1) do not match and never run.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "zensical-versioned.toml"
      - "scripts/publish-docs.sh"
      - "scripts/run-docs-ci.sh"
      - "scripts/docs_versions.py"
      - "scripts/prepare-historical-docs.py"
      - "scripts/test_docs_versions.py"
      - "docs/stylesheets/version-banner.css"
      - "docs-requirements.in"
      - "docs-requirements.txt"
      - "Makefile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Final release tag to backfill (for example v0.3.1)"
        required: true
        type: string
      dry_run:
        description: "Build against gh-pages and show the diff without committing or pushing"
        required: true
        default: true
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "zensical-versioned.toml"
      - "scripts/publish-docs.sh"
      - "scripts/run-docs-ci.sh"
      - "scripts/docs_versions.py"
      - "scripts/prepare-historical-docs.py"
      - "scripts/test_docs_versions.py"
      - "docs/stylesheets/version-banner.css"
      - "docs-requirements.in"
      - "docs-requirements.txt"
      - "Makefile"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set variables
        run: scripts/run-docs-ci.sh env >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r docs-requirements.txt
      - name: Test version bookkeeping
        run: python scripts/test_docs_versions.py
      - name: Prepare documentation source
        run: scripts/run-docs-ci.sh prepare
      - name: Build docs
        run: scripts/run-docs-ci.sh publish "$RUNNER_TEMP/docs-build"

  deploy:
    name: Deploy docs
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set variables
        run: scripts/run-docs-ci.sh env >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r docs-requirements.txt
      - name: Prepare gh-pages worktree
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gh-pages"
          echo "PUBLISH_DIR=$dir" >> "$GITHUB_ENV"
          git fetch origin gh-pages
          git worktree add --detach "$dir" origin/gh-pages
          git -C "$dir" config user.name "github-actions[bot]"
          git -C "$dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Prepare documentation source
        run: scripts/run-docs-ci.sh prepare
      - name: Build docs
        run: scripts/run-docs-ci.sh publish "$PUBLISH_DIR"
      - name: Commit and push docs
        run: |
          set -euo pipefail
          git -C "$PUBLISH_DIR" add -A
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: assembled the backfill against the existing gh-pages tree; no commit or push will be made."
            git -C "$PUBLISH_DIR" diff --cached --stat
            git -C "$PUBLISH_DIR" diff --cached --name-status
            git -C "$PUBLISH_DIR" diff --cached -- versions.json
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            git -C "$PUBLISH_DIR" add -A
            if git -C "$PUBLISH_DIR" diff --cached --quiet; then
              echo "No documentation changes to deploy"
              exit 0
            fi
            git -C "$PUBLISH_DIR" commit -q -m "docs: deploy ${GITHUB_SHA}"
            if git -C "$PUBLISH_DIR" push origin HEAD:gh-pages; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Unable to push gh-pages after ${attempt} attempts" >&2
              exit 1
            fi
            echo "gh-pages changed while deploying; resetting and retrying"
            git -C "$PUBLISH_DIR" fetch origin gh-pages
            git -C "$PUBLISH_DIR" reset --hard origin/gh-pages
            scripts/run-docs-ci.sh publish "$PUBLISH_DIR"
          done
      - name: Clean up gh-pages worktree
        if: always()
        run: git worktree remove --force "$PUBLISH_DIR" || true