# Comprehensive Development-mode sample. Brings up the main components and the
# headline Superset 7.0 features at once for end-to-end testing on a local Kind
# cluster, one pod per component so it fits a laptop. NOT for production — it
# uses inline secrets and dev-only fields.
#
# Exercises: web server, Celery worker and beat, the MCP server with API key
# auth, the realtime websocket server, Global Async Queries, thumbnails and
# alerts & reports, Gateway API routing, deployment/pod templating, and
# template processing. Requires Superset 7.0+.
#
# Prerequisites (in the same namespace):
#   - A Kind cluster created from config/samples/kind-cluster.yaml, with Envoy
#     Gateway installed (see config/samples/dev-dependencies.yaml).
#   - The dev backing services: a PostgreSQL at host "postgres" (db/user/pass
#     "superset"), a Valkey at host "valkey" (password "superset"), and the
#     "dev-gateway" Gateway:
#       kubectl apply -f config/samples/dev-dependencies.yaml
#
# Everything is served through the Gateway, on any hostname that reaches it:
#   http://superset-dev.localhost/          web server (log in with admin / admin)
#   http://superset-dev.localhost/ws        realtime websocket server
#   http://superset-dev.localhost/mcp       MCP server (Bearer API key, see config)
# *.localhost resolves to 127.0.0.1, so no /etc/hosts edit or port-forward is
# needed locally; from another machine on your network, use this host's name or
# IP instead. Open Superset through the Gateway (not a port-forward) to get
# realtime push for async queries: the browser connects to /ws on the same host.
apiVersion: superset.apache.org/v1alpha1
kind: Superset
metadata:
  name: superset-dev
spec:
  image:
    tag: 7.0.0rc1
  environment: Development
  secretKey: thisIsNotSecure_changeInProduction!

  # External, browser-visible URL, used as the link base in Alerts & Reports. It
  # would also pin the websocket URL and allowed origin, but the realtime block
  # below opts this dev sample into any hostname instead.
  baseUrl: http://superset-dev.localhost

  # Structured metastore (dev-mode inline password). Renders SQLALCHEMY_DATABASE_URI
  # as an f-string from operator-injected env vars. createDatabase attaches a
  # one-shot init container to the migrate lifecycle Job that creates the target
  # database if it does not already exist (idempotent).
  metastore:
    type: PostgreSQL
    host: postgres
    port: 5432
    database: superset
    username: superset
    password: superset
    createDatabase: true

  # Valkey drives the caches, Celery broker/results, the results backend, and the
  # distributed coordination backend that Global Async Queries and the websocket
  # server share. The operator renders CACHE_CONFIG, THUMBNAIL_CACHE_CONFIG,
  # CeleryConfig, RESULTS_BACKEND, and DISTRIBUTED_COORDINATION_CONFIG
  # automatically. Cache sub-specs below are shown explicitly to demonstrate the
  # knobs; everything else uses its defaults.
  valkey:
    host: valkey
    port: 6379
    password: superset
    cache:
      database: 1
      defaultTimeout: 300
    thumbnailCache:
      database: 5
      defaultTimeout: 3600

  # Application feature flags -> FEATURE_FLAGS dict in superset_config.py.
  # GLOBAL_ASYNC_QUERIES is set by spec.realtime.asyncQueries below.
  # FAB_API_KEY_ENABLED shows API key management on the user's Info page; the
  # matching config setting below turns the keys on.
  featureFlags:
    ENABLE_TEMPLATE_PROCESSING: true
    THUMBNAILS: true
    ALERT_REPORTS: true
    FAB_API_KEY_ENABLED: true

  # Top-level deployment/pod templating — defaults inherited by every component
  # AND by the lifecycle task pods.
  deploymentTemplate:
    revisionHistoryLimit: 3
  # podTemplate:
  #   # Optional hardening knobs, left off for dev. Without them, pods run as the
  #   # image's default user (the official Superset image's `superset`, UID 1000).
  #   # Uncomment to enforce a non-root, least-privilege pod across every component
  #   # and lifecycle task. runAsUser must be the NUMERIC UID: the image declares
  #   # `USER superset` (a name), so kubelet rejects `runAsNonRoot` alone with
  #   # "image has non-numeric user".
  #   podSecurityContext:
  #     runAsNonRoot: true
  #     runAsUser: 1000
  #     runAsGroup: 1000
  #     seccompProfile:
  #       type: RuntimeDefault
  #   container:
  #     securityContext:
  #       allowPrivilegeEscalation: false
  #       capabilities:
  #         drop: ["ALL"]
  #       readOnlyRootFilesystem: false # Superset needs /tmp and /app writes

  # Shared Python config appended to every Python component's superset_config.py.
  # The operator already renders the metastore, caches, CeleryConfig (Superset's
  # defaults plus the Valkey broker), the realtime wiring, and WEBDRIVER_BASEURL,
  # so this only carries application settings.
  config: |
    # Give thumbnail and report screenshots more time on a busy dev cluster.
    SCREENSHOT_LOCATE_WAIT = 30
    SCREENSHOT_LOAD_WAIT = 60
    # API keys (sst_...) authenticate the REST API and the MCP server as the
    # key's owner, e.g. an MCP client sending "Authorization: Bearer sst_...".
    # Set on every component: the init task creates the key permissions, the
    # web server serves the key API, and the MCP server accepts the keys.
    FAB_API_KEY_ENABLED = True
    MCP_API_KEY_ENABLED = True
    # Interactive REST API docs at /swagger/v1 (off by default in Superset 7.0).
    FAB_API_SWAGGER_UI = True

  webServer:
    # Per-component template override (field-level merge): a graceful-shutdown
    # preStop hook layered onto the inherited top-level pod template.
    podTemplate:
      container:
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]

  # The conservative preset runs two worker processes, enough for a dev cluster.
  celeryWorker:
    celery:
      preset: conservative

  # Singleton scheduler. It runs Superset's default beat schedule (reports,
  # log pruning, version-history and soft-delete retention) plus the Global
  # Async Queries orphan reaper. To add entries, extend the inherited schedule
  # in a component-level config so edits roll only the Beat Deployment:
  #   CeleryConfig.beat_schedule = {**CeleryConfig.beat_schedule, "my_task": {...}}
  celeryBeat: {}

  mcpServer: {}

  # Realtime websocket server. Ships in the official Superset image; the operator
  # injects its JWT secret and Redis connection from spec.realtime.webSocket and
  # spec.valkey.distributedCoordination.
  websocketServer: {}

  # Global Async Queries + realtime transport wiring. asyncQueries enables the
  # GLOBAL_ASYNC_QUERIES feature flag and its Celery task and orphan reaper;
  # webSocket turns on the push transport (WEBSOCKET_ENABLE) and shares a JWT
  # secret between the web server and the websocket server.
  realtime:
    asyncQueries: {}
    webSocket:
      jwtSecret: dev-websocket-jwt-secret-change-me-0123456789
      # A path makes the browser connect to /ws on whichever host it loaded
      # Superset from, and "*" (Development only) accepts any origin, so the
      # sample works under any hostname. Production deployments should rely on
      # spec.baseUrl or list their origins explicitly.
      url: /ws
      allowedOrigins: ["*"]

  # Gateway API routing through the "dev-gateway" Gateway from dev-dependencies.yaml.
  # The operator routes each component by path: / -> web, /ws -> websocket,
  # /mcp -> MCP. Without hostnames the route matches any host.
  networking:
    gateway:
      gatewayRef:
        name: dev-gateway

  lifecycle:
    # Lightweight maintenance page served while components are drained for
    # lifecycle tasks. Managed mode (no image) renders an nginx:alpine page from
    # the title/message below. Only started when a drain actually runs and an
    # existing web-server workload is present.
    maintenancePage:
      title: Superset is upgrading
      message: We'll be back shortly — applying database migrations.
    migrate: {}
    init:
      adminUser: {}
      loadExamples: true
