# Throwaway backing services for local DEVELOPMENT/testing on Kind: a PostgreSQL
# at host "postgres", a Valkey at host "valkey" (user/db "superset", password
# "superset"), and the "dev-gateway" Gateway that serves the dev samples on one
# browser-visible origin. superset_v1alpha1_superset_dev_full.yaml uses all three.
#
# WARNING: ephemeral (emptyDir) storage, plain-text passwords, plain HTTP, single
# replica — NOT for production. Data is lost when the pod restarts.
#
# The Gateway requires Envoy Gateway, which also installs the Gateway API CRDs.
# Install it once per cluster, before the operator starts (the operator detects
# the Gateway API at startup; restart it otherwise):
#
#   helm install eg oci://docker.io/envoyproxy/gateway-helm --version v1.9.2 \
#     --namespace envoy-gateway-system --create-namespace --wait
#   kubectl apply -f config/samples/dev-dependencies.yaml
#
# The Envoy proxy Service is pinned to NodePort 30080, which
# config/samples/kind-cluster.yaml maps to host port 80, so the dev sample is
# reachable at http://superset-dev.localhost/ without a port-forward
# (*.localhost resolves to 127.0.0.1).
#
# Prefer Helm for the databases? The Bitnami charts provide the same services
# with auth flags. Set fullnameOverride so the Service names match the sample (or
# update spec.metastore.host / spec.valkey.host to the chart's Service names):
#
#   helm install postgres oci://registry-1.docker.io/bitnamicharts/postgresql \
#     --set auth.username=superset --set auth.password=superset \
#     --set auth.database=superset --set fullnameOverride=postgres
#
#   helm install valkey oci://registry-1.docker.io/bitnamicharts/valkey \
#     --set architecture=standalone --set auth.password=superset \
#     --set fullnameOverride=valkey
#
# After a Helm install, run `kubectl get svc` and point the sample at the
# resulting Service names if they differ (e.g. valkey-primary).
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
    app.kubernetes.io/part-of: superset-dev
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
    app.kubernetes.io/part-of: superset-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: superset-dev
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: superset
            - name: POSTGRES_PASSWORD
              value: superset
            - name: POSTGRES_DB
              value: superset
            # Write data under a subdir so the emptyDir mount root stays clean.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "superset", "-d", "superset"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels:
    app: valkey
    app.kubernetes.io/part-of: superset-dev
spec:
  selector:
    app: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels:
    app: valkey
    app.kubernetes.io/part-of: superset-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
        app.kubernetes.io/part-of: superset-dev
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          # Require a password (matches spec.valkey.password in the sample) and
          # disable on-disk persistence for an ephemeral dev cache.
          command: ["valkey-server", "--requirepass", "superset", "--save", ""]
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "-a", "superset", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
# Envoy proxy settings for the dev Gateway: expose it as NodePort 30080 so
# kind-cluster.yaml can map it to host port 80.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: dev-gateway
  labels:
    app.kubernetes.io/part-of: superset-dev
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-dev
  labels:
    app.kubernetes.io/part-of: superset-dev
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dev-gateway
  labels:
    app.kubernetes.io/part-of: superset-dev
spec:
  gatewayClassName: envoy-dev
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: dev-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
