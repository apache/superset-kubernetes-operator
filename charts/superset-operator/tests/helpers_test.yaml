# Exercises the template helpers whose logic is most likely to regress:
# image tag fallback, fullname override, and watch.scope validation.
suite: helpers
chart:
  version: 1.0.0
  appVersion: 1.0.0
release:
  name: my-release
  namespace: my-namespace
tests:
  - it: falls back to the chart appVersion when image.tag is empty
    template: templates/deployment.yaml
    set:
      image:
        tag: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/apache/superset-kubernetes-operator:1.0.0

  - it: honours fullnameOverride for resource names
    template: templates/deployment.yaml
    set:
      fullnameOverride: custom-operator-name
    asserts:
      - equal:
          path: metadata.name
          value: custom-operator-name

  - it: rejects an invalid watch.scope
    # values.schema.json constrains watch.scope to the same enum the
    # validateWatchScope helper guards, so an invalid value fails rendering.
    template: templates/clusterrole.yaml
    set:
      watch:
        scope: bogus
    asserts:
      - failedTemplate: {}
