# Pins the strictness contract of values.schema.json. Helm validates the
# coalesced values against the schema before rendering, so these cases are about
# what an install accepts rather than any template branch — which is why the
# rejection is asserted as a template failure.
#
# The root object is permissive, while declared value blocks stay strict, 
# so a misspelling inside one is still caught at install time.
suite: values schema strictness
release:
  name: my-release
  namespace: my-namespace
tests:
  - it: accepts an undeclared top-level value
    set:
      someInjectedKey: value
    template: templates/deployment.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: still rejects an unknown key inside a declared block
    set:
      image:
        unknownField: x
    asserts:
      - failedTemplate:
          errorPattern: "at '/image': additional properties 'unknownField' not allowed"