# Stripped-down happy path: render with default values.yaml. One broad test
# snapshots the rendered manifests and asserts the default conditional wiring
# (cluster-scoped RBAC on, namespaced RBAC and ServiceMonitor off).
suite: minimal (default values)
templates:
  - templates/deployment.yaml
  - templates/serviceaccount.yaml
  - templates/clusterrole.yaml
  - templates/clusterrolebinding.yaml
  - templates/role.yaml
  - templates/rolebinding.yaml
  - templates/metrics-service.yaml
  - templates/metrics-rbac.yaml
  - templates/metrics-servicemonitor.yaml
# Pin chart/release identity so snapshots are stable across chart version bumps.
chart:
  version: 1.0.0
  appVersion: 1.0.0
release:
  name: my-release
  namespace: my-namespace
tests:
  - it: renders the default manifests
    asserts:
      # Manager Deployment: image tag falls back to appVersion, metrics on the
      # default port, and no WATCH_NAMESPACE env (default watch.scope is cluster).
      - equal:
          path: spec.replicas
          value: 1
        template: templates/deployment.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^ghcr\.io/apache/superset-kubernetes-operator:1\.0\.0$
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-bind-address=:8443
        template: templates/deployment.yaml
      - notExists:
          path: spec.template.spec.containers[0].env
        template: templates/deployment.yaml
      - matchSnapshot: {}
        template: templates/deployment.yaml
      - matchSnapshot: {}
        template: templates/serviceaccount.yaml
      # Default watch.scope: cluster -> cluster-scoped RBAC, no namespaced RBAC.
      - isKind:
          of: ClusterRole
        template: templates/clusterrole.yaml
      - isKind:
          of: ClusterRoleBinding
        template: templates/clusterrolebinding.yaml
      - hasDocuments:
          count: 0
        template: templates/role.yaml
      - hasDocuments:
          count: 0
        template: templates/rolebinding.yaml
      # Metrics on by default (Service + auth RBAC), ServiceMonitor off.
      - isKind:
          of: Service
        template: templates/metrics-service.yaml
      - hasDocuments:
          count: 3
        template: templates/metrics-rbac.yaml
      - hasDocuments:
          count: 0
        template: templates/metrics-servicemonitor.yaml
